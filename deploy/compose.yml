services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_PATH: /app/data/oster.sqlite
      UPLOAD_DIR: /app/data/uploads
      TRUST_PROXY: 1
    volumes:
      - app_data:/app/data
    expose:
      - "3001"
    mem_limit: 768m
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?Set staging hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  app_data:
  caddy_data:
  caddy_config:
